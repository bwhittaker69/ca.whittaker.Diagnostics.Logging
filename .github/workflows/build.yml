name: Build and package
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            9.0.x
            10.0.x
      - run: dotnet build ca.whittaker.Diagnostics.Logging.sln -c Release
      - run: dotnet test ca.whittaker.Diagnostics.Logging.sln -c Release
      - run: dotnet pack ca.whittaker.Diagnostics.Logging.sln -c Release -o artifacts
      - run: dotnet restore samples/Logging.Sample --source "$GITHUB_WORKSPACE/artifacts"
      - run: dotnet run --project samples/Logging.Sample -c Release --no-restore
